name: CI Pipeline

env:
  APPLICATION_NAME: cicd-devops-lab
  ENVIRONMENT: dev
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display environment
        run: |
          echo "Application: $APPLICATION_NAME"
          echo "Environment: $ENVIRONMENT"
          
      - name: Verify secret availability
        env:
          TRAINING_SECRET: ${{ secrets.TRAINING_SECRET }}
        run: |
          if [ -n "$TRAINING_SECRET" ]; then
            echo "Secret is available to the job"
          else
            echo "Secret is missing"
            exit 1
          fi

      - name: Build application
        run: |
          echo "Starting build..."
          mkdir build
          echo "Build successful" > build/result.txt
          echo "Build completed"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/
  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          echo "Running tests..."
          echo "All tests passed"
