name: CI Pipeline

env:
  APPLICATION_NAME: cicd-devops-lab
  ENVIRONMENT: dev
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display environment
        run: |
          echo "Application: $APPLICATION_NAME"
          echo "Environment: $ENVIRONMENT"
          
      - name: Verify secret availability
        env:
          TRAINING_SECRET: ${{ secrets.TRAINING_SECRET }}
        run: |
          if [ -n "$TRAINING_SECRET" ]; then
            echo "Secret is available to the job"
          else
            echo "Secret is missing"
            exit 1
          fi

      - name: Build application
        run: |
          VERSION="1.0.${{ github.run_number }}"

          echo "Application version: $VERSION"

          mkdir build

          echo "Application: $APPLICATION_NAME" > build/application.txt
          echo "Version: $VERSION" >> build/application.txt
          echo "Commit: $GITHUB_SHA" >> build/application.txt
          echo "Environment: $ENVIRONMENT" >> build/application.txt

          echo "Build completed successfully"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/
  verify-artifact:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: downloaded-artifact

      - name: Verify artifact
        run: |
          echo "Artifact contents:"
          cat downloaded-artifact/application.txt

          echo "Artifact verification successful"
  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          echo "Running tests..."
          echo "All tests passed"
