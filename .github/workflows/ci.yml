name: CI Pipeline

env:
  APPLICATION_NAME: cicd-devops-lab
  ENVIRONMENT: dev
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display environment
        run: |
          echo "Application: $APPLICATION_NAME"
          echo "Environment: $ENVIRONMENT"
          
      - name: Verify secret availability
        env:
          TRAINING_SECRET: ${{ secrets.TRAINING_SECRET }}
        run: |
          if [ -n "$TRAINING_SECRET" ]; then
            echo "Secret is available to the job"
          else
            echo "Secret is missing"
            exit 1
          fi

      - name: Build application
        run: |
          VERSION="1.0.${{ github.run_number }}"

          echo "Application version: $VERSION"

          mkdir build

          echo "Application: $APPLICATION_NAME" > build/application.txt
          echo "Version: $VERSION" >> build/application.txt
          echo "Commit: $GITHUB_SHA" >> build/application.txt
          echo "Environment: $ENVIRONMENT" >> build/application.txt

          echo "Build completed successfully"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/
  verify-artifact:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: downloaded-artifact

      - name: Verify artifact
        run: |
          echo "Artifact contents:"
          cat downloaded-artifact/application.txt

          echo "Artifact verification successful"
  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
  deploy-dev:
    needs: verify-artifact
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: artifact

      - name: Deploy to DEV
        run: |
          echo "================================"
          echo "Deploying application"
          echo "Environment: DEV"
          echo "================================"

          cat artifact/application.txt

          echo "DEV deployment successful"

      - name: Run tests
        run: |
          echo "Running tests..."
          echo "All tests passed"
  deploy-qa:
    needs: deploy-dev
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: artifact

      - name: Deploy to QA
        run: |
          echo "================================"
          echo "Deploying application"
          echo "Environment: QA"
          echo "================================"

          cat artifact/application.txt

          echo "QA deployment successful"

  deploy-uat:
    needs: deploy-qa
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: artifact

      - name: Deploy to UAT
        run: |
          echo "================================"
          echo "Deploying application"
          echo "Environment: UAT"
          echo "================================"

          cat artifact/application.txt

          echo "UAT deployment successful"


  deploy-production:
    needs: deploy-uat
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: artifact

      - name: Deploy to Production
        run: |
          echo "================================"
          echo "Deploying application"
          echo "Environment: PRODUCTION"
          echo "================================"

          cat artifact/application.txt

          echo "PRODUCTION deployment successful"

  deployment-strategy:
    needs: deploy-production
    runs-on: ubuntu-latest

    steps:
      - name: Rolling deployment simulation
        run: |
          echo "Starting rolling deployment..."
          echo "Instance 1 → v2"
          echo "Instance 2 → v2"
          echo "Instance 3 → v1"
          echo "Instance 4 → v1"

          echo "Health checks passed"

          echo "Instance 3 → v2"
          echo "Instance 4 → v2"

          echo "Rolling deployment completed"

  rollback:
    needs: deployment-strategy
    if: ${{ failure() }}
    runs-on: ubuntu-latest

    steps:
      - name: Rollback deployment
        run: |
          echo "Deployment failed"
          echo "Starting rollback..."
          echo "Restoring previous version..."
          echo "Rollback completed successfully"
